name: Tadabbur — CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BACKEND_IMAGE:  ghcr.io/syedailsa/tadabbur-backend
  FRONTEND_IMAGE: ghcr.io/syedailsa/tadabbur-frontend

jobs:

  # ══════════════════════════════════════════
  # JOB 1 — Backend CI
  # ══════════════════════════════════════════
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint — ruff
        run: pip install ruff && ruff check . || true

      - name: Security — bandit
        run: pip install bandit && bandit -r . -ll -x __pycache__ || true

      - name: Tests
        run: |
          pip install pytest pytest-asyncio httpx
          pytest tests/ -q || echo "No tests yet — skipping"

  # ══════════════════════════════════════════
  # JOB 2 — Frontend CI
  # ══════════════════════════════════════════
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit || true

      - name: Lint
        run: npm run lint || true

      - name: Build check
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: https://backend.tadabbur.tech
          NEXT_TELEMETRY_DISABLED: "1"

  # ══════════════════════════════════════════
  # JOB 3 — Docker Build & Push
  # ══════════════════════════════════════════
  build-push:
    name: Docker Build & Push
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push — backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push — frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=https://backend.tadabbur.tech
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ══════════════════════════════════════════
  # JOB 4 — Deploy to VPS
  # ══════════════════════════════════════════
  deploy:
    name: Deploy to VPS
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/tadabbur

            # ── Step 1: Kill old Gunicorn if running ───────
            # (only needed if someone manually started it)
            OLD_PIDS=$(lsof -ti :8000 2>/dev/null) || true
            if [ -n "$OLD_PIDS" ]; then
              echo "Killing old process on port 8000: $OLD_PIDS"
              kill -9 $OLD_PIDS 2>/dev/null || true
              sleep 2
            fi

            OLD_PIDS_3000=$(lsof -ti :3000 2>/dev/null) || true
            if [ -n "$OLD_PIDS_3000" ]; then
              echo "Killing old process on port 3000: $OLD_PIDS_3000"
              kill -9 $OLD_PIDS_3000 2>/dev/null || true
              sleep 2
            fi

            # ── Step 2: Login to GHCR ──────────────────────
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ── Step 3: Pull new images ────────────────────
            export IMAGE_TAG=${{ github.sha }}
            export REPO_OWNER=syedailsa
            docker compose pull backend frontend

            # ── Step 4: Rolling restart ────────────────────
            docker compose up -d --remove-orphans --no-build

            # ── Step 5: Health checks ──────────────────────
            echo "Waiting for services..."
            sleep 15

            curl -sf http://localhost:8000/ \
              && echo "✅ Backend healthy" \
              || { echo "❌ Backend FAILED"; docker compose logs backend --tail=30; exit 1; }

            curl -sf http://localhost:3000 \
              && echo "✅ Frontend healthy" \
              || { echo "❌ Frontend FAILED"; docker compose logs frontend --tail=30; exit 1; }

            # ── Step 6: Cleanup ────────────────────────────
            docker image prune -f

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚀 Deploy complete!"
            echo "   SHA: ${{ github.sha }}"
            echo "   https://chat.tadabbur.tech"
            echo "   https://backend.tadabbur.tech"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"