name: Tadabbur — CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BACKEND_IMAGE:  ghcr.io/syedailsa/tadabbur-backend
  FRONTEND_IMAGE: ghcr.io/syedailsa/tadabbur-frontend

jobs:

  # ══════════════════════════════════════════
  # JOB 1 — Backend: lint + test
  # ══════════════════════════════════════════
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint — ruff
        run: pip install ruff && ruff check . || true

      - name: Security — bandit
        run: pip install bandit && bandit -r . -ll -x __pycache__ || true

      - name: Tests
        run: |
          pip install pytest pytest-asyncio httpx
          pytest tests/ -q || echo "No tests yet — skipping"

  # ══════════════════════════════════════════
  # JOB 2 — Frontend: type-check + build
  # ══════════════════════════════════════════
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit || true

      - name: Lint
        run: npm run lint || true

      - name: Build check
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: https://backend.tadabbur.tech

  # ══════════════════════════════════════════
  # JOB 3 — Docker Build & Push to GHCR
  # Only on push to main
  # ══════════════════════════════════════════
  build-push:
    name: Docker Build & Push
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push — backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push — frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=https://backend.tadabbur.tech
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ══════════════════════════════════════════
  # JOB 4 — Deploy to Hostinger VPS
  # ══════════════════════════════════════════
  deploy:
    name: Deploy to VPS
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: /opt/tadabbur/

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/tadabbur

            # ── Stop old gunicorn + PM2 (first time only) ──
            # Gunicorn band karo — Docker le lega port 8000
            pkill -f "Tadabbur-app/backend.*gunicorn" 2>/dev/null || true
            # PM2 frontend band karo — Docker le lega port 3000
            pm2 stop frontend 2>/dev/null || true
            pm2 delete frontend 2>/dev/null || true

            # ── Login to GHCR ──────────────────────────────
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # ── Pull new images ────────────────────────────
            export IMAGE_TAG=${{ github.sha }}
            export REPO_OWNER=${{ github.repository_owner }}

            docker compose pull backend frontend

            # ── Zero-downtime restart ──────────────────────
            docker compose up -d --remove-orphans --no-build

            # ── Wait for containers to be healthy ──────────
            echo "Waiting for services to start..."
            sleep 30

            # ── Health checks ──────────────────────────────
            curl -sf http://localhost:8000/health \
              && echo "✅ Backend healthy" \
              || { echo "❌ Backend FAILED"; docker compose logs backend --tail=50; exit 1; }

            curl -sf http://localhost:3000 \
              && echo "✅ Frontend healthy" \
              || { echo "❌ Frontend FAILED"; docker compose logs frontend --tail=50; exit 1; }

            # ── Cleanup old images ─────────────────────────
            docker image prune -f

            echo "🚀 Deploy complete! SHA: ${{ github.sha }}"
            echo "   https://chat.tadabbur.tech"
            echo "   https://backend.tadabbur.tech"