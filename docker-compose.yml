version: "3.9"

# ═══════════════════════════════════════════════════════
#  Tadabbur — Docker Compose (Option A)
#
#  System Nginx already handles SSL + routing
#  Yeh containers sirf localhost ports expose karte hain:
#    backend  → localhost:8000
#    frontend → localhost:3000
#    qdrant   → localhost:6333
#
#  System Nginx waise hi proxy karta rahega — koi change nahi
# ═══════════════════════════════════════════════════════

services:

  # ── FastAPI Backend ────────────────────────────────
  backend:
    image: ghcr.io/${REPO_OWNER}/tadabbur-backend:${IMAGE_TAG:-latest}
    container_name: tadabbur_backend
    ports:
      - "127.0.0.1:8000:8000"   # sirf localhost — public nahi
    env_file: /opt/tadabbur/.env.production
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - tadabbur_net
    depends_on:
      qdrant:
        condition: service_healthy

  # ── Next.js Frontend ──────────────────────────────
  frontend:
    image: ghcr.io/${REPO_OWNER}/tadabbur-frontend:${IMAGE_TAG:-latest}
    container_name: tadabbur_frontend
    ports:
      - "127.0.0.1:3000:3000"   # sirf localhost — public nahi
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: https://backend.tadabbur.tech
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - tadabbur_net

  # ── Qdrant Vector DB ──────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: tadabbur_qdrant
    ports:
      - "127.0.0.1:6333:6333"   # sirf localhost
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - tadabbur_net

volumes:
  qdrant_storage:
    driver: local

networks:
  tadabbur_net:
    driver: bridge