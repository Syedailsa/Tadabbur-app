
version: "3.9"

services:

  backend:
    image: ghcr.io/syedailsa/tadabbur-backend:${IMAGE_TAG:-latest}
    container_name: tadabbur_backend
    ports:
      - "127.0.0.1:8080:8000"
    env_file: /opt/tadabbur/.env.production
    restart: unless-stopped
    networks:
      - tadabbur_net
    depends_on:
      - qdrant

  frontend:
    image: ghcr.io/syedailsa/tadabbur-frontend:${IMAGE_TAG:-latest}
    container_name: tadabbur_frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: https://backend.tadabbur.tech
    restart: unless-stopped
    networks:
      - tadabbur_net

  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: tadabbur_qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - tadabbur_net

volumes:
  qdrant_storage:
    driver: local

networks:
  tadabbur_net:
    driver: bridge