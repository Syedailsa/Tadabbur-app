worker_processes auto;
error_log /var/log/nginx/error.log warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json
               application/javascript text/xml application/xml;

    # Security headers (applied globally)
    add_header X-Frame-Options        "SAMEORIGIN"             always;
    add_header X-Content-Type-Options "nosniff"                always;
    add_header X-XSS-Protection       "1; mode=block"          always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    upstream backend_app  { server backend:8000;  keepalive 32; }
    upstream frontend_app { server frontend:3000; keepalive 16; }

    # ── HTTP → HTTPS ──────────────────────────────────────
    server {
        listen 80;
        server_name backend.tadabbur.tech chat.tadabbur.tech;

        # Let Certbot handle ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── backend.tadabbur.tech — FastAPI ──────────────────
    server {
        listen 443 ssl http2;
        server_name backend.tadabbur.tech;

        ssl_certificate     /etc/letsencrypt/live/backend.tadabbur.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/backend.tadabbur.tech/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 20M;

        # CORS for your Next.js frontend
        add_header Access-Control-Allow-Origin  "https://chat.tadabbur.tech" always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS"  always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type"   always;

        # Preflight
        location / {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  "https://chat.tadabbur.tech";
                add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization,Content-Type";
                add_header Content-Length 0;
                return 204;
            }
            proxy_pass         http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # WebSocket — LangGraph streaming / chat
        location /ws/ {
            proxy_pass         http://backend_app/ws/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # SSE — streaming AI responses
        location /stream/ {
            proxy_pass          http://backend_app/stream/;
            proxy_http_version  1.1;
            proxy_set_header    Host      $host;
            proxy_buffering     off;
            proxy_cache         off;
            proxy_read_timeout  300s;
            add_header          X-Accel-Buffering no;
        }
    }

    # ── chat.tadabbur.tech — Next.js ─────────────────────
    server {
        listen 443 ssl http2;
        server_name chat.tadabbur.tech;

        ssl_certificate     /etc/letsencrypt/live/chat.tadabbur.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chat.tadabbur.tech/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        # Next.js static assets — cache 1 year (content-hashed)
        location /_next/static/ {
            proxy_pass http://frontend_app/_next/static/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Public folder assets
        location /static/ {
            proxy_pass http://frontend_app/static/;
            add_header Cache-Control "public, max-age=86400";
        }

        # Next.js app (all other routes)
        location / {
            proxy_pass         http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}